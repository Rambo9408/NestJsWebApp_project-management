# =============================================================================
# nginx — serving the built SPA and proxying the API
# =============================================================================
# This is the production topology the Vite dev proxy has been imitating since
# Phase 1: ONE ORIGIN serving both the static bundle and /api. That is what
# makes the client's single relative `/api/v1` correct in both environments,
# with no CORS preflight and no environment-specific base URL.
# =============================================================================

# One worker per core. `auto` reads the container's CPU limit, so this does the
# right thing whether the container gets 0.5 cores or 8.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # `sendfile` copies file → socket inside the kernel, skipping a userspace
    # round trip. `tcp_nopush` batches headers with the file's first bytes.
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Logs to stdout/stderr, NOT to files. A container that writes logs to disk
    # fills its layer and hides them from `docker logs` and every log shipper.
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    keepalive_timeout 65;
    server_tokens off;   # Do not advertise the nginx version to scanners.

    # -------------------------------------------------------------------------
    # COMPRESSION
    # -------------------------------------------------------------------------
    # Our main bundle is ~686 kB raw and ~212 kB gzipped (measured in Phase 16).
    # Without this every visitor downloads the raw figure.
    #
    # `gzip_min_length 1024` because compressing a 200-byte response costs more
    # CPU than it saves bytes, and can make the response LARGER.
    #
    # NOT LISTED: image formats. PNG/JPEG/WebP are already compressed; gzipping
    # them burns CPU for ~0%.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        # 8080, not 80: the container runs nginx as a NON-ROOT user, and
        # unprivileged users cannot bind ports below 1024.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # SECURITY HEADERS
        # ---------------------------------------------------------------------
        # Cheap, and they close real attack classes.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # Referrer-Policy matters MORE than usual here: the SSE stream carries an
        # access token in its query string (EventSource cannot set headers), and
        # a permissive referrer policy would leak that URL to any third-party
        # host the page later links to. See phase-15.

        # `always` on every one of these is deliberate. Without it nginx omits
        # the header on 4xx/5xx responses — so an error page, which is exactly
        # where an attacker is probing, would ship unprotected.

        # ---------------------------------------------------------------------
        # THE SPA FALLBACK — the single most important rule in this file
        # ---------------------------------------------------------------------
        # Flagged back in Phase 4 and outstanding until now.
        #
        # THE BUG WITHOUT IT: the app renders /tasks/abc123 client-side, but no
        # such file exists on disk. A soft navigation works, and a HARD REFRESH
        # or a pasted link returns a real 404 from nginx. So the app appears to
        # work until a user reloads or shares a URL — which is to say, until it
        # is actually used.
        #
        # `try_files` looks for the literal file, then a directory, then falls
        # back to index.html and lets React Router decide. That is why
        # /nonexistent returns 200 with our 404 page rather than nginx's.
        #
        # It is the most common SPA deployment bug there is.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # CACHE HEADERS — two rules, and the split is the whole point
        # ---------------------------------------------------------------------
        # Vite emits content-hashed filenames (index-BLVaBgDA.js). A hashed file
        # can NEVER change its contents, so it is safe to cache forever.
        # `immutable` additionally tells the browser not to revalidate on
        # reload — which is what stops a hard refresh re-downloading 245 kB of
        # vendor chunks.
        #
        # This is what makes the Phase 16 chunk splitting pay off: vendor chunks
        # keep their hash across deploys and stay cached, so an app deploy costs
        # the returning user ~8.5 kB instead of ~213 kB.
        location /assets/ {
            # NOTE: no 'expires' directive. It emits its OWN Cache-Control header,
            # so pairing it with an explicit add_header produced TWO
            # Cache-Control headers on every response - observed on the running
            # container. Harmless in practice (browsers take the first) but it
            # is ambiguous, and ambiguity in a caching header is how a stale
            # bundle survives a deploy. One header, stated once.
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            # Repeated because this block defines add_header - see above.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            access_log off;   # Static asset hits are noise once cached.
        }

        # index.html MUST NOT BE CACHED. It is the only unhashed file, and it is
        # what points at the current hashed bundles. Cache it and a returning
        # user loads yesterday's HTML, which references chunk hashes that no
        # longer exist — a blank page after every deploy, fixed only by a hard
        # refresh the user does not know to perform.
        #
        # The pair is the standard SPA caching contract:
        #   hashed assets  -> cache forever
        #   entry HTML     -> never cache
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            # Repeated because this block defines add_header - see above. This is
            # the block that was silently dropping them, and it serves the entry
            # page for EVERY route via the SPA fallback.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        }

        # ---------------------------------------------------------------------
        # API PROXY — same origin, which is the point
        # ---------------------------------------------------------------------
        # `api` is the compose service name; Docker's embedded DNS resolves it.
        # Using localhost here is the classic mistake — it points at THIS
        # container, and the connection is refused with a confusing message.
        location /api/ {
            proxy_pass http://api:3000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Without X-Forwarded-*, the backend logs every request as coming
            # from the proxy's IP, and rate limiting by IP throttles everyone as
            # one client.
        }

        # ---------------------------------------------------------------------
        # SSE — needs its own block, and the reason is not obvious
        # ---------------------------------------------------------------------
        # nginx BUFFERS proxied responses by default. For a normal request that
        # is a feature; for an event stream it means events sit in a buffer
        # until it fills, so a notification can arrive minutes late or not at
        # all. `proxy_buffering off` is mandatory.
        #
        # `proxy_read_timeout` must exceed the backend's heartbeat interval (30s
        # — see notifications.controller.ts) or nginx closes an idle-looking
        # connection and the client reconnects in a loop. 1h with a 30s
        # heartbeat is comfortable.
        #
        # `Connection ''` clears the default `close`, keeping the upstream
        # connection alive for the life of the stream.
        location /api/v1/notifications/stream {
            proxy_pass http://api:3000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health probes live at the domain root — the backend deliberately
        # EXCLUDES them from the /api prefix and from versioning so
        # infrastructure can probe a path no API change can break.
        location /health/ {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            access_log off;
        }

        # nginx's own liveness, answered without touching the backend. A probe
        # that depends on an upstream reports the upstream's health, not this
        # container's — and restarting nginx because the API is down is exactly
        # the wrong response.
        location = /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;
        }
    }
}
